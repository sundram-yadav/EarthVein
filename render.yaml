# Render Blueprint: one web service that serves both the API and the built frontend.
# New > Blueprint, point it at this repository, then fill in the values marked sync: false.
services:
  - type: web
    name: earthvein
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false            # MongoDB Atlas connection string
      - key: MONGO_DB
        value: earthvein
      - key: ADMIN_EMAIL
        value: admin@earthvein.in
      - key: ADMIN_PASSWORD
        sync: false            # at least 10 characters
      - key: CONTROL_EMAIL
        value: control@earthvein.in
      - key: CONTROL_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"          # demo customers with a public password; set to false for a real launch
      - key: GOOGLE_CLIENT_ID
        sync: false            # optional
